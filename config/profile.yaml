profile:
  name: Gaurang Jagtap
  email_recipient_env: EMAIL_RECIPIENT
  github: https://github.com/Gaurang58

search:
  countries: [gb, de, nl, ie]
  results_per_query: 40
  max_email_jobs: 20
  max_job_age_days: 14
  minimum_match_score: 45
  minimum_overall_score: 45
  email_country_limits:
    gb: 5
    de: 6
    nl: 6
    ie: 6
    unknown: 1
  reed_locations: [London, Manchester, Birmingham, Leeds, Bristol]
  rss_feeds:
    - https://stackoverflow.blog/jobs/feed/
    - https://weworkremotely.com/categories/remote-programming-jobs.rss

providers:
  adzuna:
    enabled: true
    countries: [gb, de, nl]
    request_delay_seconds: 0.2
  reed:
    enabled: true
    countries: [gb]
  rss:
    enabled: true
  arbeitnow:
    enabled: true
  jobicy:
    enabled: true
    countries: [ie, nl, de]
    industries: [engineering, dev]
    results_per_request: 100
    excluded_levels: [senior, director, executive]
  serpapi:
    enabled: true
    countries: [gb, de, nl, ie]
    locations:
      gb: United Kingdom
      de: Germany
      nl: Netherlands
      ie: Ireland
    hl: en
    request_delay_seconds: 0.2

roles:
  canonical:
    software_engineer:
      positive_titles:
        - software engineer
        - software developer
        - junior software engineer
        - graduate software engineer
        - backend engineer
        - backend developer
        - softwareentwickler
        - junior softwareentwickler
    devops_engineer:
      positive_titles:
        - devops engineer
        - junior devops engineer
        - devops-ingenieur
    cloud_engineer:
      positive_titles: [cloud engineer, junior cloud engineer]
    frontend_engineer:
      positive_titles: [react developer, frontend developer, front end developer]
    fullstack_engineer:
      positive_titles: [full stack developer, fullstack developer, mern stack developer]
    sre:
      positive_titles: [site reliability engineer, sre]
  excluded_titles:
    - senior
    - sr
    - sr.
    - principal
    - lead
    - manager
    - director
    - staff
    - staff engineer
    - architect
    - unpaid
    - internship
    - intern

skills:
  high_priority:
    - JavaScript
    - Node.js
    - React
    - REST API
    - Docker
    - Kubernetes
    - Azure
    - AWS
    - CI/CD
    - Terraform
    - SQL
  medium_priority:
    - Microservices
    - NoSQL
    - Helm
    - Grafana
    - Linux
    - Agile
    - Automated testing
    - TDD
    - SOLID
    - Monitoring
    - Infrastructure as Code

salary_preferences:
  gb: {currency: GBP, preferred_min: 25000}
  de: {currency: EUR, preferred_min: 40000}
  nl: {currency: EUR, preferred_min: 38000}
  ie: {currency: EUR, preferred_min: 38000}

eligibility:
  rules_path: config/eligibility_rules.yaml
  registry_cache_ttl_hours: 168
  uk_register_url: https://www.gov.uk/government/publications/register-of-licensed-sponsors-workers
  nl_register_url: https://ind.nl/en/public-register-recognised-sponsors/public-register-work

google_sheets:
  enabled: true
  tracker_worksheet: Jobs Tracker
  state_worksheet: Bot State
  email_log_worksheet: Email Log

queries:
  - junior software engineer
  - software engineer
  - junior devops engineer
  - devops engineer
  - junior cloud engineer
  - cloud engineer
  - site reliability engineer
  - node.js developer
  - react developer
  - full stack developer
  - mern stack developer
  - javascript developer
